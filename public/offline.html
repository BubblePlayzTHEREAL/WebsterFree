<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Lexica</title>
  <meta name="theme-color" content="#fbfaf7">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root {
      --paper: #fbfaf7;
      --ink: #292524;
      --ink-soft: #78716c;
      --line: #e7e5e4;
      --brand: #b32500;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      background: var(--brand);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      font-weight: 700;
      border-radius: 14px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 15px;
    }
    .hint {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 13.5px;
      color: var(--ink-soft);
    }
    .hint b { color: var(--ink); }
    .retry {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 22px;
      background: var(--brand);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
    }
    .retry:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">L</span>
    <h1>You&rsquo;re offline</h1>
    <p>Lexica needs a connection to look up new words. Your recently viewed entries are still available from cache.</p>
    <a class="retry" href="/">Try again</a>
    <p class="hint"><b>Tip:</b> words you looked up before going offline may still load from the app&rsquo;s cache.</p>
  </main>
</body>
</html>
